<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Portal da Escola</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Cabeçalho -->
    <header class="cabecalho">
        <h1 id="titulo-principal">Escola Técnica</h1>
        <p class="texto">Educação para o futuro.</p>
    </header>

    <!-- Banner -->
    <section class="banner">
        <h2 class="titulo">Bem-vindo ao nosso portal!</h2>
        <p class="texto">Conheça nossa escola e nossos cursos.</p>
    </section>

    <!-- Cursos -->
    <section class="cursos">
        <h2 class="titulo">Nossos Cursos</h2>

        <p class="curso">Informática</p>
        <p class="curso">Administração</p>
        <p class="curso">Eletrônica</p>
    </section>

    <!-- Contato -->
    <section class="contato">
        <h2 class="titulo">Contato</h2>

        <p class="texto">Email: escola@email.com</p>
        <p class="texto">Telefone: (11) 99999-9999</p>
    </section>

    <!-- Rodapé -->
    <footer class="rodape">
        <p class="texto">© 2026 Escola Técnica</p>
    </footer>

</body>

</html>
